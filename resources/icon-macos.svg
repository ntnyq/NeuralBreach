<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Neural Breach</title>
  <desc id="description">A continuous yellow code path on a solid graphite rounded square, with five equal recessed cells on a regular matrix.</desc>
  <defs>
    <linearGradient id="base-fill" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#45414e" />
      <stop offset="0.46" stop-color="#292630" />
      <stop offset="1" stop-color="#15131b" />
    </linearGradient>
    <linearGradient id="base-rim" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#c1bacd" stop-opacity="0.6" />
      <stop offset="0.3" stop-color="#736b82" stop-opacity="0.18" />
      <stop offset="1" stop-color="#08070c" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="path-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff744" />
      <stop offset="0.45" stop-color="#fcee09" />
      <stop offset="1" stop-color="#e5d800" />
    </linearGradient>
    <linearGradient id="path-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffda2" />
      <stop offset="0.48" stop-color="#fff53b" />
      <stop offset="1" stop-color="#b7aa00" />
    </linearGradient>
    <filter id="base-shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#08060d" flood-opacity="0.5" />
    </filter>
    <filter id="path-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#06050a" flood-opacity="0.75" />
    </filter>
    <path id="base" d="M 272 64 H 752 C 890 64 960 134 960 272 V 752 C 960 890 890 960 752 960 H 272 C 134 960 64 890 64 752 V 272 C 64 134 134 64 272 64 Z" />
    <!-- One continuous contour, including the two clipped terminal corners. -->
    <path id="route" d="M 272 188 H 408 Q 432 188 432 212 V 416 H 768 Q 792 416 792 440 V 748 L 746 794 H 640 Q 616 794 616 770 V 586 H 304 Q 280 586 280 562 V 374 H 236 Q 212 374 212 350 V 248 Z" />
    <!-- Shared cell geometry: 80 × 80, radius 8. Centers use a 176-unit grid. -->
    <rect id="cell" x="-40" y="-40" width="80" height="80" rx="8" />
    <g id="matrix-cells">
      <use href="#cell" x="352" y="304" />
      <use href="#cell" x="352" y="480" />
      <use href="#cell" x="528" y="480" />
      <use href="#cell" x="704" y="480" />
      <use href="#cell" x="704" y="656" />
    </g>
    <mask id="matrix-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024" style="mask-type: luminance">
      <rect width="1024" height="1024" fill="white" />
      <use href="#matrix-cells" fill="black" />
    </mask>
  </defs>
  <g filter="url(#base-shadow)">
    <use href="#base" fill="url(#base-fill)" />
    <use href="#base" fill="none" stroke="url(#base-rim)" stroke-width="5" />
    <use href="#base" transform="translate(8 8) scale(0.984375)" fill="none" stroke="#8b8299" stroke-opacity="0.12" stroke-width="2" />
  </g>
  <!-- The opaque base remains beneath every recess; only outside the tile is transparent. -->
  <g filter="url(#path-shadow)">
    <g mask="url(#matrix-cutouts)">
      <use href="#route" fill="url(#path-fill)" />
      <use href="#route" fill="none" stroke="url(#path-rim)" stroke-width="3" />
    </g>
  </g>
  <use href="#matrix-cells" fill="none" stroke="#c6b900" stroke-opacity="0.65" stroke-width="2" />
</svg>
